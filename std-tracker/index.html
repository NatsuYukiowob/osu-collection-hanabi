<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Std Tracker — osu! Rankings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
    <a class="site-header-title" href="index.html">
        <svg class="site-header-title-icon" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6"><circle cx="50" cy="50" r="41"/><circle cx="50" cy="50" r="20" fill="currentColor" stroke="none"/></svg>
        Std <span>Tracker</span>
    </a>
    <div class="site-header-row2">
    <nav>
        <a href="index.html" class="active" data-i18n="nav_home">Home</a>
        <a href="rankings.html" data-i18n="nav_rankings">Rankings</a>
        <a href="feed.html" data-i18n="nav_feed">Live Feed</a>
    </nav>
    <button class="lang-toggle" id="lang-toggle" type="button">EN</button>
    </div>
</header>
<main class="home">
    <div class="home-hero">
        <p class="home-hero-tagline" data-i18n="home_tagline">Tracking osu! players worldwide — rankings and live scores.</p>
    </div>

    <div class="home-grid">
        <section class="home-panel home-panel--top">
            <div class="home-panel-head">
                <h2 data-i18n="home_top_players">Top Players</h2>
                <a class="home-view-all" href="rankings.html" data-i18n="view_all">View all →</a>
            </div>
            <div class="home-top-list" id="home-top-list"></div>
        </section>

        <div class="home-col-right">
            <section class="home-panel">
                <div class="home-panel-head">
                    <h2 data-i18n="home_recent_scores">Recent Scores</h2>
                    <a class="home-view-all" href="feed.html" data-i18n="view_all">View all →</a>
                </div>
                <div class="home-recent-list" id="home-recent-list"></div>
            </section>
        </div>
    </div>
</main>
<footer class="site-footer">
    <span data-i18n="footer_main">Std Tracker — a companion site for osu-collection-hanabi. Data via the official osu! API.</span>
    <span class="footer-links">
        <a href="https://github.com/hanabirn/osu-collection-hanabi/commits/main/std-tracker" target="_blank" rel="noopener noreferrer" data-i18n="footer_changelog">Changelog</a>
        <a href="https://github.com/hanabirn/osu-collection-hanabi/issues/new" target="_blank" rel="noopener noreferrer" data-i18n="footer_feedback">Feedback</a>
    </span>
</footer>
<script src="js/common.js"></script>
<script src="js/settings-panel.js"></script>
<script src="js/api.js"></script>
<script src="js/render-home.js"></script>
