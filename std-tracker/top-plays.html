<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Std Tracker — Top Plays</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
    <a class="site-header-title" href="index.html">
        <svg class="site-header-title-icon" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6"><circle cx="50" cy="50" r="41"/><circle cx="50" cy="50" r="20" fill="currentColor" stroke="none"/></svg>
        Std <span>Tracker</span>
    </a>
    <div class="site-header-row2">
    <nav>
        <a href="index.html" data-i18n="nav_home">Home</a>
        <a href="rankings.html" data-i18n="nav_rankings">Rankings</a>
        <a href="feed.html" data-i18n="nav_feed">Live Feed</a>
        <a href="top-plays.html" class="active" data-i18n="nav_top_plays">Top Plays</a>
        <a href="farm-trending.html" data-i18n="nav_farm_trending">Trending Farm</a>
        <a href="maps.html" data-i18n="nav_maps">Maps</a>
        <a href="farm-helper.html" data-i18n="nav_farm_helper">Farm Helper</a>
        <a href="goals.html" data-i18n="nav_goals">Goals</a>
        <a href="discord.html" data-i18n="nav_discord">Discord</a>
    </nav>
    <button class="lang-toggle" id="lang-toggle" type="button">EN</button>
    <a class="ct-login-btn" id="st-login-btn" href="/.netlify/functions/osu-login" data-i18n="login_with_osu">Login with osu!</a>
    <div class="ct-login-pill" id="st-logged-in-pill" style="display:none">
        <img id="st-logged-in-avatar" class="ct-login-avatar" alt="">
        <span id="st-logged-in-name"></span>
        <button type="button" id="st-logout-btn" class="ct-logout-btn" data-i18n="logout">Logout</button>
    </div>
    <span class="ct-login-msg" id="st-login-msg" hidden></span>
    </div>
</header>
<main class="wide">
    <h1><span data-i18n="h1_top_plays">Top Plays</span></h1>
    <p class="coverage-note" id="coverage-note" data-i18n="loading">Loading…</p>
    <div class="filters">
        <div class="pill-group" id="filter-range-group">
            <button type="button" class="pill" data-hours="24" data-i18n="filter_range_24h">24h</button>
            <button type="button" class="pill" data-hours="72" data-i18n="filter_range_3d">3d</button>
            <button type="button" class="pill active" data-hours="168" data-i18n="filter_range_7d">7d</button>
            <button type="button" class="pill" data-hours="720" data-i18n="filter_range_30d">30d</button>
        </div>
        <div class="flag-select" id="filter-country-combo">
            <button type="button" class="flag-select-btn" id="filter-country-btn" aria-haspopup="listbox" aria-expanded="false">
                <img class="flag-select-flag" id="filter-country-flag" alt="" hidden>
                <span id="filter-country-label" data-i18n="filter_all_countries">All countries</span>
                <svg class="flag-select-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="flag-select-panel" id="filter-country-panel" role="listbox" hidden></div>
        </div>
    </div>
    <div class="table-wrap">
    <table>
        <thead>
            <tr><th data-i18n="th_player">Player</th><th data-i18n="th_map">Map</th><th data-i18n="th_mods">Mods</th><th data-i18n="th_grade">Grade</th><th data-i18n="th_acc">Acc</th><th data-i18n="th_pp">pp</th><th data-i18n="th_when">When</th><th></th></tr>
        </thead>
        <tbody id="feed-body"></tbody>
    </table>
    </div>
    <div class="pagination">
        <button id="prev-page" data-i18n="prev">← Prev</button>
        <span id="page-label"></span>
        <button id="next-page" data-i18n="next">Next →</button>
    </div>
</main>
<footer class="site-footer">
    <span data-i18n="footer_main">Std Tracker — a companion site for osu-collection-hanabi. Data via the official osu! API.</span>
    <span class="footer-links">
        <a href="https://github.com/hanabirn/osu-collection-hanabi/commits/main/std-tracker" target="_blank" rel="noopener noreferrer" data-i18n="footer_changelog">Changelog</a>
        <a href="https://github.com/hanabirn/osu-collection-hanabi/issues/new" target="_blank" rel="noopener noreferrer" data-i18n="footer_feedback">Feedback</a>
    </span>
</footer>
<script src="js/common.js"></script>
<script src="js/settings-panel.js"></script>
<script src="js/api.js"></script>
<script src="js/render-top-plays.js"></script>
</body>
</html>
