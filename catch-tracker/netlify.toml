[build]
  publish = "."
  functions = "netlify/functions"
  # Skip the build+deploy entirely when a push only touched files outside
  # catch-tracker/ (e.g. the main site or mp-bot). Saves build credits —
  # mirrors the main site's own netlify.toml `ignore` pattern. See
  # scripts/should-build.mjs for the path list.
  ignore = "node scripts/should-build.mjs"

[[plugins]]
  package = "@netlify/plugin-functions-install-core"

# The Discord bot's Interactions Endpoint URL — set this exact path (this
# site's own domain + /discord) in the Discord developer portal. Same
# pattern as the main site's own netlify.toml redirect.
[[redirects]]
  from = "/discord"
  to = "/.netlify/functions/discord-interactions"
  status = 200

# Rankings sweep: refresh global catch pp-rankings + discover newly-ranked
# players — see netlify/functions/_rankings-crawl-core.js. pp-rankings
# move slowly, so hourly is plenty; this also doubles as player discovery
# for the score-poller's queue.
[functions."rankings-crawl-cron"]
  schedule = "0 * * * *"

# Score-poll sweep: the "live" part of "live score tracker" — round-robins
# over the tracked player pool and detects new scores. See
# netlify/functions/_scores-poll-core.js. Every 5 min: the tightest cadence
# this repo's cron conventions comfortably support (main site's Farm
# crawler runs every 10 min for comparison).
[functions."scores-poll-cron"]
  schedule = "*/5 * * * *"

# Map catalog sweep: every ranked + loved catch beatmap, for the Maps page.
# See netlify/functions/_maps-crawl-core.js. 30 min matches the main site's
# Catalog crawler cadence — this only needs to keep pace with newly ranked/
# loved maps, nothing time-sensitive.
[functions."maps-crawl-cron"]
  schedule = "*/30 * * * *"

# Peer best-plays sweep (farm helper): caches each tracked player's own
# top-100 best plays for farm-helper.js's peer-comparison reads. See
# netlify/functions/_peer-crawl-core.js. 10 min: between rankings' hourly
# and score-poll's 5-min — this isn't as time-sensitive as the live feed,
# but a full population sweep still needs many ticks so it shouldn't be
# slower than necessary either.
[functions."peer-crawl-cron"]
  schedule = "*/10 * * * *"

# Daily rank-history snapshot (player page's rank-delta arrows): reads the
# already-cached rankings:global dataset, no osu! API calls of its own —
# see _rank-snapshot-core.js. Once a day is plenty; rank movement over a
# few hours isn't meaningful.
[functions."rank-snapshot-cron"]
  schedule = "0 4 * * *"

# Country-rank backfill: the bulk rankings endpoint _rankings-crawl-core.js
# sweeps never returns country_rank, so this round-robins the tracked pool
# with one live per-user API call each, writing the result into
# rankings:global — see _country-rank-crawl-core.js. 15 min: a full ~10k
# sweep spans many ticks regardless, so this just needs to keep pace with
# a daily rank-snapshot, not be real-time.
[functions."country-rank-crawl-cron"]
  schedule = "*/15 * * * *"
