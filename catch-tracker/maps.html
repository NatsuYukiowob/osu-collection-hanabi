<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catch Tracker — Map Catalog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
    <div class="brand">Catch <span>Tracker</span></div>
    <nav>
        <a href="index.html" data-i18n="nav_home">Home</a>
        <a href="rankings.html" data-i18n="nav_rankings">Rankings</a>
        <a href="feed.html" data-i18n="nav_feed">Live Feed</a>
        <a href="top-plays.html" data-i18n="nav_top_plays">Top Plays</a>
        <a href="maps.html" class="active" data-i18n="nav_maps">Maps</a>
        <a href="skins.html" data-i18n="nav_skins">Skins</a>
        <a href="farm-helper.html" data-i18n="nav_farm_helper">Farm Helper</a>
        <a href="replays.html" data-i18n="nav_replays">Replays</a>
    </nav>
    <button class="lang-toggle" id="lang-toggle" type="button">EN</button>
    <a class="ct-login-btn" id="ct-login-btn" href="/.netlify/functions/osu-replay-login" data-i18n="login_with_osu">Login with osu!</a>
    <div class="ct-login-pill" id="ct-logged-in-pill" style="display:none">
        <img id="ct-logged-in-avatar" class="ct-login-avatar" alt="">
        <span id="ct-logged-in-name"></span>
        <button type="button" id="ct-logout-btn" class="ct-logout-btn" data-i18n="logout">Logout</button>
    </div>
    <span class="ct-login-msg" id="ct-login-msg" hidden></span>
</header>
<main class="wide">
    <h1 class="maps-title">
        <svg class="maps-title-icon" viewBox="0 0 100 100" fill="none" stroke="currentColor" stroke-width="6"><circle cx="50" cy="50" r="41"/><circle cx="50" cy="38" r="7" fill="currentColor" stroke="none"/><circle cx="38" cy="60" r="5.5" fill="currentColor" stroke="none"/><circle cx="62" cy="60" r="5.5" fill="currentColor" stroke="none"/></svg>
        <span data-i18n="h1_maps">osu!catch Map Catalog</span>
    </h1>
    <p class="coverage-note" id="coverage-note" data-i18n="loading">Loading…</p>
    <div class="filters">
        <input type="text" id="maps-search" class="search-input" style="width:220px" data-i18n-placeholder="maps_search_placeholder" placeholder="Search title, artist, creator…">
        <div class="pill-group" id="status-filter">
            <button type="button" class="pill active" data-status="" data-i18n="status_any">Any status</button>
            <button type="button" class="pill" data-status="ranked" data-i18n="status_ranked">Ranked</button>
            <button type="button" class="pill" data-status="loved" data-i18n="status_loved">Loved</button>
        </div>
        <select id="maps-sort">
            <option value="star_desc" data-i18n="sort_star_desc">Stars high→low</option>
            <option value="star_asc" data-i18n="sort_star_asc">Stars low→high</option>
            <option value="bpm_desc" data-i18n="sort_bpm_desc">BPM high→low</option>
            <option value="length_desc" data-i18n="sort_length_desc">Length long→short</option>
            <option value="playcount_desc" data-i18n="sort_playcount_desc">Most played</option>
            <option value="newest" data-i18n="sort_newest">Newest</option>
        </select>
        <div class="star-range" id="star-range">
            <svg class="star-range-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.98 6.04 6.67.97-4.83 4.7 1.14 6.65L12 17.77l-5.96 3.13 1.14-6.65-4.83-4.7 6.67-.97L12 2.5z"/></svg>
            <span class="star-range-label" id="star-range-label" data-i18n="star_any">Any</span>
            <div class="star-range-track">
                <div class="star-range-fill" id="star-range-fill"></div>
                <input type="range" id="star-min" class="star-range-input" min="0" max="10" step="0.1" value="0" aria-label="Minimum star rating">
                <input type="range" id="star-max" class="star-range-input" min="0" max="10" step="0.1" value="10" aria-label="Maximum star rating">
            </div>
        </div>
        <div class="star-range star-range--plain" id="bpm-range">
            <svg class="star-range-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
            <span class="star-range-label" id="bpm-range-label" data-i18n="bpm_any">Any BPM</span>
            <div class="star-range-track">
                <div class="star-range-fill" id="bpm-range-fill"></div>
                <input type="range" id="bpm-min" class="star-range-input" min="0" max="400" step="5" value="0" aria-label="Minimum BPM">
                <input type="range" id="bpm-max" class="star-range-input" min="0" max="400" step="5" value="400" aria-label="Maximum BPM">
            </div>
        </div>
        <div class="star-range star-range--plain" id="length-range">
            <svg class="star-range-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>
            <span class="star-range-label" id="length-range-label" data-i18n="length_any">Any length</span>
            <div class="star-range-track">
                <div class="star-range-fill" id="length-range-fill"></div>
                <input type="range" id="length-min" class="star-range-input" min="0" max="600" step="10" value="0" aria-label="Minimum length">
                <input type="range" id="length-max" class="star-range-input" min="0" max="600" step="10" value="600" aria-label="Maximum length">
            </div>
        </div>
        <button type="button" class="pill" id="random-map-btn" data-i18n="random_map">🎲 Random</button>
    </div>
    <div class="map-grid" id="maps-grid"></div>
    <div class="pagination">
        <button id="prev-page" data-i18n="prev">← Prev</button>
        <span id="page-label"></span>
        <button id="next-page" data-i18n="next">Next →</button>
    </div>
</main>
<footer class="site-footer">
    <span data-i18n="footer_main">Catch Tracker — a companion site for osu-collection-hanabi. Data via the official osu! API.</span>
    <span class="footer-links">
        <a href="https://github.com/hanabirn/osu-collection-hanabi/commits/main/catch-tracker" target="_blank" rel="noopener noreferrer" data-i18n="footer_changelog">Changelog</a>
        <a href="https://github.com/hanabirn/osu-collection-hanabi/issues/new" target="_blank" rel="noopener noreferrer" data-i18n="footer_feedback">Feedback</a>
    </span>
</footer>
<script src="js/common.js"></script>
<script src="js/settings-panel.js"></script>
<script src="js/api.js"></script>
<script src="js/render-maps.js"></script>
</body>
</html>
