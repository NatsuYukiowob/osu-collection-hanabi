<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catch Tracker — Live Feed</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
    <div class="brand">Catch <span>Tracker</span></div>
    <nav>
        <a href="index.html" data-i18n="nav_rankings">Rankings</a>
        <a href="feed.html" class="active" data-i18n="nav_feed">Live Feed</a>
        <a href="maps.html" data-i18n="nav_maps">Maps</a>
        <a href="skins.html" data-i18n="nav_skins">Skins</a>
        <a href="farm-helper.html" data-i18n="nav_farm_helper">Farm Helper</a>
    </nav>
    <button class="lang-toggle" id="lang-toggle" type="button">EN</button>
    <a class="ct-login-btn" id="ct-login-btn" href="/.netlify/functions/osu-replay-login" data-i18n="login_with_osu">Login with osu!</a>
    <div class="ct-login-pill" id="ct-logged-in-pill" style="display:none">
        <img id="ct-logged-in-avatar" class="ct-login-avatar" alt="">
        <span id="ct-logged-in-name"></span>
        <button type="button" id="ct-logout-btn" class="ct-logout-btn" data-i18n="logout">Logout</button>
    </div>
    <span class="ct-login-msg" id="ct-login-msg" hidden></span>
</header>
<main>
    <h1 data-i18n="h1_feed">Live Score Feed</h1>
    <p class="coverage-note" id="coverage-note" data-i18n="loading">Loading…</p>
    <div class="feed-active-row" id="feed-active-row" hidden>
        <span class="feed-active-label" data-i18n="currently_active">Currently playing</span>
        <div class="feed-active-avatars" id="feed-active-avatars"></div>
    </div>
    <div class="filters">
        <div class="pill-group" id="filter-grade-group"></div>
        <button type="button" class="pill toggle" id="filter-fc" data-i18n="filter_fc_only">FC only</button>
        <button type="button" class="pill toggle" id="filter-choke" data-i18n="filter_choke_only">Choke/fail only</button>
        <div class="flag-select" id="filter-country-combo">
            <button type="button" class="flag-select-btn" id="filter-country-btn" aria-haspopup="listbox" aria-expanded="false">
                <img class="flag-select-flag" id="filter-country-flag" alt="" hidden>
                <span id="filter-country-label" data-i18n="filter_all_countries">All countries</span>
                <svg class="flag-select-caret" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </button>
            <div class="flag-select-panel" id="filter-country-panel" role="listbox" hidden></div>
        </div>
    </div>
    <div class="table-wrap">
    <table>
        <thead>
            <tr><th data-i18n="th_player">Player</th><th data-i18n="th_map">Map</th><th data-i18n="th_mods">Mods</th><th data-i18n="th_grade">Grade</th><th data-i18n="th_acc">Acc</th><th data-i18n="th_pp">pp</th><th data-i18n="th_when">When</th><th></th></tr>
        </thead>
        <tbody id="feed-body"></tbody>
    </table>
    </div>
    <div class="pagination">
        <button id="prev-page" data-i18n="prev">← Prev</button>
        <span id="page-label"></span>
        <button id="next-page" data-i18n="next">Next →</button>
    </div>
</main>
<footer class="site-footer">
    <span data-i18n="footer_feed">Auto-refreshes every 45s. Catch Tracker — a companion site for osu-collection-hanabi.</span>
    <span class="footer-links">
        <a href="https://github.com/hanabirn/osu-collection-hanabi/commits/main/catch-tracker" target="_blank" rel="noopener noreferrer" data-i18n="footer_changelog">Changelog</a>
        <a href="https://github.com/hanabirn/osu-collection-hanabi/issues/new" target="_blank" rel="noopener noreferrer" data-i18n="footer_feedback">Feedback</a>
    </span>
</footer>
<script src="js/common.js"></script>
<script src="js/api.js"></script>
<script src="js/render-feed.js"></script>
</body>
</html>
